name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - name: Verify tracked bundle
        run: git diff --exit-code -- custom_components/budget_manager/frontend/budget-manager-panel.js
      - run: npm run test:frontend
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components tests
      - name: Build integration archive
        run: python tests/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: budget-manager-release
          path: |
            budget_manager.zip
            SHA256SUMS
            RELEASE_NOTES.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: budget-manager-release
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" budget_manager.zip SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
